<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bộ Giải Mã</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--ink:#1a1a2e;--card:#fffdf7;--border:#d4c9b0;
  --accent:#c0392b;--accent2:#2c3e7a;--muted:#8a7f6e;
}
body{
  background:var(--bg);
  background-image:radial-gradient(circle at 20% 20%,rgba(192,57,43,.04) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(44,62,122,.04) 0%,transparent 50%);
  color:var(--ink);font-family:'Nunito',sans-serif;min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1' fill='%23c0392b' opacity='0.06'/%3E%3C/svg%3E");
  background-size:30px 30px;pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:48px 20px 80px}

/* Header */
.stamp{display:inline-block;border:2.5px solid var(--accent);color:var(--accent);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;padding:4px 14px;text-transform:uppercase;margin-bottom:20px;position:relative}
.stamp::before,.stamp::after{content:'';position:absolute;top:50%;width:8px;height:8px;border-radius:50%;background:var(--accent);transform:translateY(-50%)}
.stamp::before{left:-14px}.stamp::after{right:-14px}
header{text-align:center;margin-bottom:52px;padding-top:12px}
h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:900;color:var(--ink);line-height:1.05;margin-bottom:10px;letter-spacing:-1px}
h1 em{font-style:normal;color:var(--accent)}
.tagline{font-size:.95rem;color:var(--muted);font-weight:600;letter-spacing:.8px}

/* ── BA BỘ ĐẾM – góc trên phải ── */
#counters{
  position:fixed;top:12px;right:14px;z-index:10000;
  display:flex;align-items:center;gap:8px;
  pointer-events:none;user-select:none;
}
.cnt{
  display:flex;align-items:center;gap:4px;
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.3px;
}
#cnt-outer{ color:rgba(138,127,110,.55); }
#cnt-outer svg{ opacity:.4; }
#cnt-outer .cnum{ opacity:.7; }

#cnt-inner{ color:rgba(44,62,122,.5); display:none; }
#cnt-inner svg{ opacity:.4; }
#cnt-inner .cnum{ opacity:.75; }

#cnt-admin{ color:rgba(180,83,9,.5); display:none; }
#cnt-admin svg{ opacity:.4; }
#cnt-admin .cnum{ opacity:.75; }

.cnt-div{ width:1px;height:12px;background:rgba(138,127,110,.3);display:none; }

/* ── UNDO / REDO – góc trên trái ── */
#nav-btns{
  position:fixed;top:12px;left:14px;z-index:10000;
  display:none;align-items:center;gap:6px;
}
.nav-btn{
  background:none;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:4px;
  color:rgba(138,127,110,.5);
  transition:color .2s,background .2s;
}
.nav-btn:hover:not(:disabled){ color:var(--ink);background:rgba(138,127,110,.1); }
.nav-btn:disabled{ opacity:.25;cursor:default; }
.nav-btn svg{ width:14px;height:14px; }

/* Tabs */
.tabs{display:flex;border:2px solid var(--ink);overflow:hidden;margin-bottom:28px;box-shadow:4px 4px 0 var(--ink)}
.tab{flex:1;padding:13px 10px;border:none;background:var(--card);color:var(--muted);font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;border-right:2px solid var(--ink);transition:all .2s;letter-spacing:.3px}
.tab:last-child{border-right:none}
.tab.active{background:var(--ink);color:var(--card)}
.tab:hover:not(.active){background:var(--bg)}

/* Card */
.card{background:var(--card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:28px;margin-bottom:24px}
label{display:block;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
textarea{width:100%;background:var(--bg);border:2px solid var(--border);color:var(--ink);font-family:'Nunito',sans-serif;font-size:1.05rem;line-height:1.7;padding:16px;resize:vertical;outline:none;transition:border-color .2s;min-height:130px;border-radius:0}
textarea:focus{border-color:var(--ink)}
textarea::placeholder{color:var(--muted);font-style:italic}
.output-box{width:100%;min-height:130px;background:var(--bg);border:2px solid var(--border);padding:16px;font-family:'Nunito',sans-serif;font-size:1.05rem;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-all}
.output-box.empty::after{content:'Kết quả sẽ hiện ở đây…';color:var(--muted);font-style:italic}

/* Actions */
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:18px}
.btn{padding:11px 24px;border:2px solid var(--ink);font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;transition:all .15s;letter-spacing:.2px}
.btn-main{background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn-main:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn-main:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink)}
.btn-copy{background:var(--accent2);color:#fff;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.btn-copy:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}

.arrow-row{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 20px;font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:1px}
.arrow-row::before,.arrow-row::after{content:'';flex:1;height:1px;background:var(--border)}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--card);padding:12px 28px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.9rem;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--accent);z-index:999;transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

footer{text-align:center;margin-top:48px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:1px}
footer span{color:var(--accent)}

/* Password screen */
#pw-screen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  background-image:radial-gradient(circle at 20% 20%,rgba(192,57,43,.04) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(44,62,122,.04) 0%,transparent 50%);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .4s;
}
#pw-screen::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1' fill='%23c0392b' opacity='0.06'/%3E%3C/svg%3E");background-size:30px 30px;pointer-events:none}
.pw-box{position:relative;background:var(--card);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:44px 40px 36px;width:100%;max-width:380px;text-align:center}
.pw-icon{font-size:2rem;margin-bottom:12px}
.pw-box h2{font-size:1.5rem;font-weight:900;color:var(--ink);margin-bottom:6px}
.pw-sub{font-size:.85rem;color:var(--muted);font-family:'Space Mono',monospace;margin-bottom:28px;letter-spacing:.3px}
.pw-wrap{position:relative;margin-bottom:16px}
#pw-input{width:100%;background:var(--bg);border:2px solid var(--border);color:var(--ink);font-family:'Space Mono',monospace;font-size:1.4rem;letter-spacing:6px;padding:14px 48px 14px 16px;outline:none;text-align:center;border-radius:0;transition:border-color .2s}
#pw-input:focus{border-color:var(--ink)}
#pw-input::-ms-reveal,#pw-input::-ms-clear{display:none}
#pw-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:4px}
#pw-eye:hover{color:var(--ink)}
.pw-err{color:var(--accent);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;min-height:18px;margin-bottom:14px;opacity:0;transition:opacity .2s}
.pw-err.show{opacity:1}
.btn-pw{width:100%;font-size:1rem;padding:14px}

/* Admin badge nhỏ trong pw-box */
#admin-badge{
  display:none;margin-top:14px;
  font-family:'Space Mono',monospace;font-size:10px;
  color:rgba(180,83,9,.6);letter-spacing:1px;
}

@media(max-width:500px){
  .card{padding:18px}h1{font-size:2rem}
  .actions{flex-direction:column;align-items:stretch}.btn{text-align:center}
  .pw-box{padding:32px 20px 28px}#pw-input{font-size:1.2rem;letter-spacing:4px}
  #counters{top:8px;right:10px}#nav-btns{top:8px;left:10px}
}
</style>
</head>
<body>

<!-- NÚT UNDO / REDO (góc trái – hiện sau khi đăng nhập) -->
<div id="nav-btns">
  <button class="nav-btn" id="btn-undo" onclick="navUndo()" disabled title="Quay lại trang nhập mật khẩu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 14 4 9 9 4"/>
      <path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
    </svg>
  </button>
  <button class="nav-btn" id="btn-redo" onclick="navRedo()" disabled title="Vào lại trang dịch thuật">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 14 20 9 15 4"/>
      <path d="M4 20v-7a4 4 0 0 1 4-4h12"/>
    </svg>
  </button>
</div>

<!-- BA BỘ ĐẾM -->
<div id="counters">
  <div class="cnt" id="cnt-outer" title="Lượt mở trang">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
    </svg>
    <span class="cnum" id="num-outer">·</span>
  </div>
  <div class="cnt-div" id="div-inner"></div>
  <div class="cnt" id="cnt-inner" title="Lần nhập đúng mật khẩu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <span class="cnum" id="num-inner">·</span>
  </div>
  <div class="cnt-div" id="div-admin"></div>
  <div class="cnt" id="cnt-admin" title="Lần đăng nhập admin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="12" height="12">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    <span class="cnum" id="num-admin">·</span>
  </div>
</div>

<!-- MÀN HÌNH MẬT KHẨU -->
<div id="pw-screen">
  <div class="pw-box">
    <div class="pw-icon">🔑</div>
    <h2>Nhập Mật Khẩu</h2>
    <p class="pw-sub">Trang web được bảo vệ riêng tư</p>
    <div class="pw-wrap">
      <input type="password" id="pw-input" maxlength="30" placeholder="••••••" autocomplete="off">
      <button id="pw-eye" onclick="toggleEye()" title="Hiện/ẩn">👁</button>
    </div>
    <div class="pw-err" id="pw-err">Mật khẩu không đúng</div>
    <button class="btn btn-main btn-pw" onclick="checkPw()">Xác nhận →</button>
    <div id="admin-badge">★ ADMIN MODE</div>
  </div>
</div>

<!-- NỘI DUNG CHÍNH -->
<div class="wrap">
  <header>
    <div><span class="stamp">Mật Mã Riêng Tư</span></div>
    <h1>Bộ <em>Giải Mã</em><br>Ngôn Ngữ Bí Mật</h1>
    <p class="tagline">♡ Chỉ dành cho người được chia sẻ ♡</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-d" onclick="setMode('d')">🔓 Giải mã → Văn bản</button>
    <button class="tab" id="tab-e" onclick="setMode('e')">🔐 Văn bản → Mã hóa</button>
  </div>

  <div class="card">
    <label id="lbl-in">Nhập chuỗi mã</label>
    <textarea id="inp" placeholder="Nhập nội dung cần dịch…" oninput="syncLive()"></textarea>
  </div>

  <div class="arrow-row">▼ kết quả ▼</div>

  <div class="card">
    <label id="lbl-out">Văn bản đã giải</label>
    <div class="output-box empty" id="out"></div>
  </div>

  <div class="actions">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-main" onclick="run()">⚡ Dịch</button>
      <button class="btn btn-ghost" onclick="clr()">✕ Xóa</button>
    </div>
    <button class="btn btn-copy" onclick="cp()">⎘ Sao chép</button>
  </div>

  <footer>
    <p>Trang web riêng tư · <span>Không chia sẻ</span> nội dung với người lạ</p>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== CIPHER ENGINE ===== */
(function(){
var A={},B={};
[['21','a'],['22','b'],['23','c'],['31','d'],['32','e'],['33','f'],
['41','g'],['42','h'],['43','i'],['51','j'],['52','k'],['53','l'],
['61','m'],['62','n'],['63','o'],['71','p'],['72','q'],['73','r'],['74','s'],
['81','t'],['82','u'],['83','v'],['91','w'],['92','x'],['93','y'],['94','z'],
['11','ă'],['12','â'],['13','ê'],['14','ô'],['15','ơ'],['16','ư']
].forEach(function(p){A[p[0]]=p[1];B[p[1]]=p[0];});
var T={'00':'','01':'\u0300','02':'\u0301','03':'\u0309','04':'\u0303','05':'\u0323'};
var TC={'\u0300':'01','\u0301':'02','\u0309':'03','\u0303':'04','\u0323':'05'};
var TV={
'à':['a','\u0300'],'á':['a','\u0301'],'ả':['a','\u0309'],'ã':['a','\u0303'],'ạ':['a','\u0323'],
'è':['e','\u0300'],'é':['e','\u0301'],'ẻ':['e','\u0309'],'ẽ':['e','\u0303'],'ẹ':['e','\u0323'],
'ì':['i','\u0300'],'í':['i','\u0301'],'ỉ':['i','\u0309'],'ĩ':['i','\u0303'],'ị':['i','\u0323'],
'ò':['o','\u0300'],'ó':['o','\u0301'],'ỏ':['o','\u0309'],'õ':['o','\u0303'],'ọ':['o','\u0323'],
'ù':['u','\u0300'],'ú':['u','\u0301'],'ủ':['u','\u0309'],'ũ':['u','\u0303'],'ụ':['u','\u0323'],
'ỳ':['y','\u0300'],'ý':['y','\u0301'],'ỷ':['y','\u0309'],'ỹ':['y','\u0303'],'ỵ':['y','\u0323'],
'ằ':['ă','\u0300'],'ắ':['ă','\u0301'],'ẳ':['ă','\u0309'],'ẵ':['ă','\u0303'],'ặ':['ă','\u0323'],
'ầ':['â','\u0300'],'ấ':['â','\u0301'],'ẩ':['â','\u0309'],'ẫ':['â','\u0303'],'ậ':['â','\u0323'],
'ề':['ê','\u0300'],'ế':['ê','\u0301'],'ể':['ê','\u0309'],'ễ':['ê','\u0303'],'ệ':['ê','\u0323'],
'ồ':['ô','\u0300'],'ố':['ô','\u0301'],'ổ':['ô','\u0309'],'ỗ':['ô','\u0303'],'ộ':['ô','\u0323'],
'ờ':['ơ','\u0300'],'ớ':['ơ','\u0301'],'ở':['ơ','\u0309'],'ỡ':['ơ','\u0303'],'ợ':['ơ','\u0323'],
'ừ':['ư','\u0300'],'ứ':['ư','\u0301'],'ử':['ư','\u0309'],'ữ':['ư','\u0303'],'ự':['ư','\u0323']
};
var CP={};Object.keys(TV).forEach(function(k){var v=TV[k];CP[v[0]+v[1]]=k;});
function dw(w){
  var r='',i=0;
  while(i<w.length){
    var tk=w.slice(i,i+2);
    if(tk.length<2){r+=w[i];i++;continue;}
    if(A[tk]){var base=A[tk],nx=w.slice(i+2,i+4);
      if(nx.length===2&&T[nx]!==undefined){var c=T[nx],cb=base+c;r+=(CP[cb]||cb);i+=4;}
      else{r+=base;i+=2;}
    }else{r+=w[i];i++;}
  }return r;
}
function ew(w){
  var r='';
  for(var j=0;j<w.length;j++){
    var ch=w[j].toLowerCase();
    if(TV[ch]){var p=TV[ch];r+=(B[p[0]]||p[0])+(TC[p[1]]||'00');}
    else if(B[ch]){r+=B[ch];}else{r+=w[j];}
  }return r;
}
window._tr=function(s,m){
  return s.split(' ').map(function(w){
    if(!w)return w;
    var x=w.match(/^(.*?)([.,?!;:\u2026\u201c\u201d"'()\[\]]+)?$/);
    var body=x[1]||'',punc=x[2]||'';
    return(m==='d'?dw(body):ew(body))+punc;
  }).join(' ');
};
})();

/* ===== NAVIGATION STATE ===== */
var _navHistory = ['lock'];
var _navIdx = 0;

function updateNavBtns(){
  var canUndo = (_navIdx > 0);
  var canRedo = (_navIdx < _navHistory.length - 1);
  document.getElementById('btn-undo').disabled = !canUndo;
  document.getElementById('btn-redo').disabled = !canRedo;
}

function navPush(state){
  _navHistory = _navHistory.slice(0, _navIdx + 1);
  _navHistory.push(state);
  _navIdx = _navHistory.length - 1;
  updateNavBtns();
}

function navUndo(){
  if(_navIdx <= 0) return;
  _navIdx--;
  applyNavState(_navHistory[_navIdx]);
  updateNavBtns();
}

function navRedo(){
  if(_navIdx >= _navHistory.length - 1) return;
  _navIdx++;
  applyNavState(_navHistory[_navIdx]);
  updateNavBtns();
}

function applyNavState(state){
  var pw = document.getElementById('pw-screen');
  if(state === 'lock'){
    pw.style.display = 'flex';
    pw.style.opacity = '1';
    setTimeout(function(){ document.getElementById('pw-input').focus(); }, 50);
  } else {
    pw.style.display = 'none';
    pw.style.opacity = '0';
  }
}

/* ===== UI ===== */
var _m='d';
function setMode(m){
  _m=m;
  document.getElementById('tab-d').classList.toggle('active',m==='d');
  document.getElementById('tab-e').classList.toggle('active',m==='e');
  document.getElementById('lbl-in').textContent=m==='d'?'Nhập chuỗi mã':'Nhập văn bản';
  document.getElementById('lbl-out').textContent=m==='d'?'Văn bản đã giải':'Mã hóa';
  document.getElementById('inp').placeholder=m==='d'?'Nhập chuỗi mã cần giải…':'Nhập văn bản Tiếng Việt hoặc Tiếng Anh cần mã hóa…';
  clr();
}
function run(){
  var v=document.getElementById('inp').value.trim(),o=document.getElementById('out');
  if(!v){o.textContent='';o.classList.add('empty');return;}
  o.textContent=window._tr(v,_m);o.classList.remove('empty');
}
function syncLive(){run();}
function clr(){
  document.getElementById('inp').value='';
  var o=document.getElementById('out');o.textContent='';o.classList.add('empty');
}
function cp(){
  var t=document.getElementById('out').textContent;
  if(!t)return;
  try{
    var ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){}
  showToast('✓ Đã sao chép!');
}
function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},2000);
}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run();
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();navUndo();}
  if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();navRedo();}
});

/* ===== P ===== */
// Hash P_Normal
var _H  = 'd8b7da5d8736c3d519758f0c6cdf4a412043c1fdf6e456ac7795f98104b5f4b4';
// Hash P_Admin
var _HA = 'fd6eb0d3bdd9aba7bfa8f3040ee8a56d25e5de8354df9a4bda6cad2fc2f8a090';

async function checkPw(){
  var v=document.getElementById('pw-input').value;
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  var h=Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');

  if(h===_H || h===_HA){
    var isAdmin = (h===_HA);
    var s=document.getElementById('pw-screen');
    s.style.transition='opacity .4s';s.style.opacity='0';
    setTimeout(function(){s.style.display='none';},400);

    // Hiện nút Undo/Redo góc trái
    document.getElementById('nav-btns').style.display='flex';

    navPush('main');

    if(isAdmin){
      incrementAdmin();
      showInnerCounter();
      showAdminCounter();
    } else {
      incrementInner();
      showInnerCounter();
    }
  } else {
    var err=document.getElementById('pw-err'),inp=document.getElementById('pw-input');
    err.classList.add('show');inp.style.borderColor='var(--accent)';
    inp.value='';inp.focus();
    setTimeout(function(){err.classList.remove('show');inp.style.borderColor='';},2000);
  }
}

function toggleEye(){
  var i=document.getElementById('pw-input');
  i.type=i.type==='password'?'text':'password';
}
document.getElementById('pw-input').focus();
document.getElementById('pw-input').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();checkPw();}
});

/* ===== BỘ ĐẾM ===== */
function setNum(id,n){ var el=document.getElementById(id);if(el)el.textContent=n; }

function showInnerCounter(){
  document.getElementById('cnt-inner').style.display='flex';
  document.getElementById('div-inner').style.display='block';
}
function showAdminCounter(){
  document.getElementById('cnt-admin').style.display='flex';
  document.getElementById('div-admin').style.display='block';
}

// Bộ đếm NGOÀI: tăng mỗi lần tải trang
async function incrementOuter(){
  var cur=0;
  try{var r=await window.storage.get('cnt-outer');if(r)cur=parseInt(r.value)||0;}catch(e){}
  cur++;
  try{await window.storage.set('cnt-outer',String(cur));}catch(e){}
  setNum('num-outer',cur);
}

// Bộ đếm TRONG: tăng khi nhập đúng mật khẩu thường
async function incrementInner(){
  var cur=0;
  try{var r=await window.storage.get('cnt-inner');if(r)cur=parseInt(r.value)||0;}catch(e){}
  cur++;
  try{await window.storage.set('cnt-inner',String(cur));}catch(e){}
  setNum('num-inner',cur);
}

// Bộ đếm ADMIN: tăng khi nhập đúng mật khẩu admin
async function incrementAdmin(){
  var cur=0;
  try{var r=await window.storage.get('cnt-admin');if(r)cur=parseInt(r.value)||0;}catch(e){}
  cur++;
  try{await window.storage.set('cnt-admin',String(cur));}catch(e){}
  setNum('num-admin',cur);
}

// Khởi động: tăng bộ đếm ngoài ngay, đọc trong+admin từ storage (không tăng)
async function initCounters(){
  // Tăng và hiển thị bộ đếm ngoài
  await incrementOuter();

  // Đọc bộ đếm trong và admin (chỉ để sẵn số, không hiện)
  var keys=['cnt-inner','cnt-admin'];
  var ids=['num-inner','num-admin'];
  for(var i=0;i<keys.length;i++){
    var n=0;
    try{var r=await window.storage.get(keys[i]);if(r)n=parseInt(r.value)||0;}catch(e){}
    setNum(ids[i],n);
  }
}

initCounters();
updateNavBtns();
</script>
